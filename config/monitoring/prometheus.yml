# Prometheus Configuration for Ray Cluster Monitoring
# Searidge Multi-System Setup
#
# This config uses Ray's HTTP service discovery to automatically find
# all nodes in the cluster and scrape their metrics.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager configuration (optional - uncomment if you set up alerting)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Rule files (optional - for custom alerting rules)
# rule_files:
#   - "alert_rules.yml"

scrape_configs:
  # ==========================================================================
  # RAY CLUSTER METRICS (Auto-discovery via HTTP)
  # ==========================================================================
  # This automatically discovers all Ray nodes and scrapes their metrics
  - job_name: 'ray'
    http_sd_configs:
      - url: 'http://192.168.88.18:8265/api/prometheus/sd'
        refresh_interval: 60s

  # ==========================================================================
  # ALTERNATIVE: File-based Service Discovery
  # ==========================================================================
  # Uncomment this if HTTP SD doesn't work, and use the file generated by Ray
  # - job_name: 'ray-file-sd'
  #   file_sd_configs:
  #     - files:
  #       - '/tmp/ray/prom_metrics_service_discovery.json'

  # ==========================================================================
  # STATIC FALLBACK: Manual Node Configuration
  # ==========================================================================
  # If auto-discovery fails, uncomment and use static targets
  # - job_name: 'ray-static'
  #   static_configs:
  #     - targets:
  #       - '192.168.88.18:8080'  # searidge02 (head)
  #       - '192.168.88.17:8080'  # searidge01 (worker)
  #       - '192.168.88.19:8080'  # searidge03 (worker)
  #       labels:
  #         cluster: 'searidge'

  # ==========================================================================
  # PROMETHEUS SELF-MONITORING
  # ==========================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ==========================================================================
  # NODE EXPORTER (System metrics - optional)
  # ==========================================================================
  # Uncomment if you install node_exporter on each machine
  # - job_name: 'node'
  #   static_configs:
  #     - targets:
  #       - '192.168.88.18:9100'  # searidge02
  #       - '192.168.88.17:9100'  # searidge01
  #       - '192.168.88.19:9100'  # searidge03

