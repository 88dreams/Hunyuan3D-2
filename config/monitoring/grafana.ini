# Grafana Configuration for Searidge Cluster
# Custom configuration for Ray metrics monitoring

[paths]
data = /srv/searidge_share/monitoring/grafana
logs = /srv/searidge_share/monitoring/grafana/logs
plugins = /srv/searidge_share/monitoring/grafana/plugins
provisioning = /srv/searidge_share/monitoring/grafana/provisioning

[server]
protocol = http
http_addr = 0.0.0.0
http_port = 3000
domain = searidge02
root_url = %(protocol)s://%(domain)s:%(http_port)s/

[database]
type = sqlite3
path = /srv/searidge_share/monitoring/grafana/grafana.db

[security]
admin_user = admin
admin_password = searidge_admin
secret_key = searidge_secret_change_me

[users]
allow_sign_up = false

[auth.anonymous]
enabled = false

[dashboards]
versions_to_keep = 20

[alerting]
enabled = true

[unified_alerting]
enabled = true

[log]
mode = console file
level = info

[log.file]
log_rotate = true
max_lines = 1000000
max_size_shift = 28
daily_rotate = true
max_days = 7

